# Stable build tooling. Minecraft dependencies and identity live in stonecutter.properties.toml.
stonecutter_version=0.9.8
loom_back_compat_version=0.4.2
foojay_version=1.0.0
kotlin_version=2.4.20
spotless_version=8.10.3
ktlint_version=1.8.0

# Run Gradle with Java 25; per-target compilation and game toolchains are separate.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.warning.mode=all
# Reliability first: do not opt into configuration cache across the multi-version graph.
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=true

# Fabric Language Kotlin supplies Kotlin libraries at runtime.
kotlin.stdlib.default.dependency=false
kotlin.code.style=official
