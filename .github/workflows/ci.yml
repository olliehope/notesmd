name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    name: Read Minecraft targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the central target configuration
        id: targets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          with pathlib.Path("stonecutter.properties.toml").open("rb") as source:
              configuration = tomllib.load(source)

          targets = []
          for minecraft, properties in configuration.items():
              if not minecraft[:1].isdigit():
                  continue
              if not re.fullmatch(r"\d+(?:\.\d+){1,2}", minecraft):
                  raise ValueError(f"Invalid Minecraft target: {minecraft!r}")
              java = properties["java"]["version"]
              if type(java) is not int or java < 1:
                  raise ValueError(f"Invalid Java version for {minecraft}: {java!r}")
              targets.append({"minecraft": minecraft, "java": java})

          if not targets:
              raise ValueError("No Minecraft targets were found in stonecutter.properties.toml")

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": targets}) + "\n")
          PY

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      # setup-gradle validates every committed wrapper JAR against Gradle's known checksums.
      # Basic caching uses the open-source provider; setup-java does not also cache Gradle.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check formatting
        run: ./gradlew --no-daemon --stacktrace :spotlessCheck

  build:
    name: Minecraft ${{ matrix.minecraft }} / Java ${{ matrix.java }}
    needs: [targets, formatting]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both families are configured during Gradle import. The last JDK runs Gradle;
      # the Java/Kotlin toolchains select the target's configured Java version.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check and build this Minecraft target
        env:
          MINECRAFT_TARGET: ${{ matrix.minecraft }}
        run: ./gradlew --no-daemon --stacktrace ":$MINECRAFT_TARGET:check" ":$MINECRAFT_TARGET:buildAndCollect"
      - name: Upload distributable JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fabric-mc${{ matrix.minecraft }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-dev-shadow.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI passed
    if: ${{ always() }}
    needs: [targets, formatting, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require formatting and every Minecraft target to pass
        env:
          TARGETS_RESULT: ${{ needs.targets.result }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$TARGETS_RESULT" != "success" || "$FORMATTING_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            echo "CI failed: targets=$TARGETS_RESULT formatting=$FORMATTING_RESULT build=$BUILD_RESULT"
            exit 1
          fi
